name: sync-release

# Rebuilds the generated branch (main) from the latest official labview-mcp release.
#
# ZCode refuses any single archive entry above 50 MB, and the official exe is ~85 MB, so
# the exe ships as two <50 MB parts that bin/launch.cmd reassembles on first run
# (byte-identical: copy /b part00 + part01 == official exe). The MCP command in
# .mcp.json / .zcode-plugin/plugin.json goes through PowerShell + Join-Path with
# $env:CLAUDE_PLUGIN_ROOT and no backslashes or brace placeholders, because ZCode's
# install step normalizes path-like strings once and mangles backslash escapes.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify the latest upstream release
        id: rel
        run: |
          set -euo pipefail
          rel=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "User-Agent: labview-mcp-zcode-sync" \
            https://api.github.com/repos/Zuehlke/labview-mcp/releases/latest)
          tag=$(node -e "console.log(JSON.parse(process.argv[1]).tag_name)" "$rel")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/rel"
          for f in labview-mcp.zip labview-mcp.sha256; do
            curl -fsSL -H "User-Agent: labview-mcp-zcode-sync" -o "$RUNNER_TEMP/rel/$f" \
              "https://github.com/Zuehlke/labview-mcp/releases/download/${tag}/$f"
          done
          cd "$RUNNER_TEMP/rel"
          sha=$(sha256sum labview-mcp.zip | awk '{print $1}')
          official=$(awk '{print $1}' labview-mcp.sha256)
          if [ "$sha" != "$official" ]; then
            echo "::error::checksum mismatch for $tag (got $sha, official $official)"
            exit 1
          fi
          echo "verified $tag sha256=$sha"

      - name: Already current?
        id: cmp
        run: |
          set -euo pipefail
          cur=$(awk -F': *' '/^tag:/{print $2}' VERSION.txt 2>/dev/null || true)
          if [ "$cur" = "${{ steps.rel.outputs.tag }}" ]; then
            echo "same=1" >> "$GITHUB_OUTPUT"
          else
            echo "same=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the branch
        if: steps.cmp.outputs.same == '0'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/tree"
          mkdir -p "$tree"
          unzip -q "$RUNNER_TEMP/rel/labview-mcp.zip" -d "$tree"

          # 50 MB archive-entry ceiling: ship the exe as two parts, reassembled by launch.cmd.
          exe_size=$(stat -c %s "$tree/bin/LabVIEWMCP.exe")
          split -b 44000000 -d "$tree/bin/LabVIEWMCP.exe" "$tree/bin/LabVIEWMCP.exe.part"
          rm "$tree/bin/LabVIEWMCP.exe"
          sum=0
          for p in "$tree"/bin/LabVIEWMCP.exe.part*; do sum=$((sum + $(stat -c %s "$p"))); done
          test "$sum" -eq "$exe_size" || { echo "::error::parts do not add up to the exe size"; exit 1; }

          cat > "$tree/bin/launch.cmd" <<'LAUNCH'
@echo off
rem Reassembles LabVIEWMCP.exe from its two parts on first run (ZCode refuses any
rem single archive entry above 50 MB, and the official exe is ~85 MB), then execs it.
setlocal
set "BIN=%~dp0"
set "EXE=%BIN%LabVIEWMCP.exe"
if not exist "%EXE%" (
  copy /b "%BIN%LabVIEWMCP.exe.part00"+"%BIN%LabVIEWMCP.exe.part01" "%EXE%" >nul
  if errorlevel 1 (
    echo launch.cmd: failed to reassemble LabVIEWMCP.exe 1>&2
    exit /b 1
  )
)
"%EXE%" %*
LAUNCH

          # Generated manifests. No backslashes and no ${...} placeholders on purpose:
          # ZCode normalizes such strings once at install time and breaks backslash escapes.
          node -e '
            const fs = require("fs");
            const d = process.env.RUNNER_TEMP + "/tree";
            const pj = JSON.parse(fs.readFileSync(d + "/.claude-plugin/plugin.json", "utf8"));
            const vt = fs.readFileSync(d + "/VERSION.txt", "utf8");
            const tag = vt.match(/^tag:\s*(\S+)/)[1];
            const version = tag.replace(/^v/, "");
            if (pj.version !== version) throw new Error(`version mismatch: ${pj.version} vs ${version}`);
            const mcp = { mcpServers: { labview: {
              command: "powershell",
              args: ["-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
                     "& cmd /c (Join-Path $env:CLAUDE_PLUGIN_ROOT \x27bin/launch.cmd\x27)"],
              env: {},
            } } };
            fs.writeFileSync(d + "/.mcp.json", JSON.stringify(mcp, null, 2) + "\n");
            const zc = {
              name: pj.name, displayName: pj.displayName || "LabVIEW MCP", version,
              description: pj.description, author: pj.author, homepage: pj.homepage,
              mcpServers: mcp.mcpServers,
            };
            fs.mkdirSync(d + "/.zcode-plugin", { recursive: true });
            fs.writeFileSync(d + "/.zcode-plugin/plugin.json", JSON.stringify(zc, null, 2) + "\n");
            const listing = {
              name: "zuehlke-labview-zcode",
              description: "Community ZCode marketplace for the official LabVIEW MCP release. Unofficial - not affiliated with or endorsed by Zuhlke. The tree is the official release, sha256-verified.",
              owner: { name: "SeveNOlogy7" },
              plugins: [{
                name: "labview-mcp",
                source: "./",
                version,
                description: pj.description,
                author: { name: "Zuhlke Engineering AG (upstream); marketplace maintained by SeveNOlogy7" },
                homepage: pj.homepage,
                repository: "https://github.com/Zuehlke/labview-mcp",
                license: "MIT",
                keywords: ["labview", "mcp", "aixml", "ni", "zcode"],
                category: "developer-tools",
              }],
            };
            const text = JSON.stringify(listing, null, 2) + "\n";
            fs.writeFileSync(d + "/marketplace.json", text);
            fs.writeFileSync(d + "/.claude-plugin/marketplace.json", text);
          '

          # Static files carried across the rewrite.
          cp README.md "$tree/"
          mkdir -p "$tree/.github/workflows"
          cp .github/workflows/sync-release.yml "$tree/.github/workflows/"
          : > "$tree/.gitignore"

          git checkout --orphan sync-tree
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$tree/." .
          git add -A --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: ${TAG} (official release tree, sha256-verified, exe split for ZCode 50 MB entry ceiling)"

          # Assertions.
          bad=$(find . -path ./.git -prune -o -type f -size +52428799c -print | head -1)
          test -z "$bad" || { echo "::error::file above the 50 MiB ceiling: $bad"; exit 1; }
          for f in marketplace.json .claude-plugin/marketplace.json .claude-plugin/plugin.json .zcode-plugin/plugin.json .mcp.json VERSION.txt bin/launch.cmd bin/LabVIEWMCP.exe.part00 bin/LabVIEWMCP.exe.part01; do
            git ls-tree -r HEAD | grep -q "	$f$" || { echo "::error::missing $f"; exit 1; }
          done
          ! git ls-tree -r HEAD | grep -q "	bin/LabVIEWMCP.exe$" || { echo "::error::unsplit exe present"; exit 1; }

          git push --force origin HEAD:main
          echo "main rebuilt at $(git rev-parse --short HEAD) for ${TAG}"
